name: Test build

on:
  push:
    branches: [test-build]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y libwebkit2gtk-4.1-dev librsvg2-dev libudev-dev libayatana-appindicator3-dev patchelf gstreamer1.0-plugins-base gstreamer1.0-plugins-good
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm build
      - working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Build Linux
        if: runner.os == 'Linux'
        run: |
          pnpm tauri build --bundles appimage
          mkdir out
          cp src-tauri/target/release/bundle/appimage/*.AppImage out/OpenStreamDeck.AppImage
      - name: Build macOS
        if: runner.os == 'macOS'
        run: |
          pnpm tauri build --target universal-apple-darwin --bundles app
          mkdir out
          ditto -c -k --keepParent "src-tauri/target/universal-apple-darwin/release/bundle/macos/Open Stream Deck.app" out/OpenStreamDeck-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: OpenStreamDeck-${{ runner.os }}
          path: out/*
