[package]
name = "open-stream-deck"
version = "1.0.0"
description = "Приложение для макропанели AJAZZ AKP153R с прошивкой Open Stream Deck"
authors = ["whxtelxs"]
edition = "2024"
license-file = "../LICENSE"
repository = "https://github.com/Open-Stream-Deck/Open-Stream-Deck-App"
publish = false

[lib]
name = "open_stream_deck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
opensd-package = "1.2.0"
opensd-ui = "1.2.0"
getrandom = "0.3"
sha2 = "0.10"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hidapi = { version = "2.6", default-features = false, features = ["windows-native", "linux-static-hidraw", "macos-shared-device"] }
enigo = { version = "0.3", default-features = false, features = ["x11rb"] }
sysinfo = { version = "0.33", default-features = false, features = ["system", "network", "disk"] }
tokio = { version = "1.53.3", features = ["net", "sync", "macros", "rt", "time", "io-util"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3.34"
percent-encoding = "2.3.2"
tauri-plugin-dialog = "2.8.3"
velopack = "1.2.161"
ureq = "3"
url = "2"
base64 = "0.22"
resvg = "0.49"
zip = { version = "9", default-features = false, features = ["deflate"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
windows = { version = "0.62", features = ["Foundation", "Media_Control", "Win32_Media_Audio", "Win32_Graphics_Dxgi", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Performance"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
